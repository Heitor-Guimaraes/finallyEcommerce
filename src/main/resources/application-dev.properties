# Este arquivo é opcional - use application.properties para configurações padrão
# Ou configure via argumentos: --spring.profiles.active=dev

# ============================================
# DATABASE CONFIGURATION (DEV PROFILE)
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA/HIBERNATE CONFIGURATION
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# ============================================
# JWT CONFIGURATION
# ============================================
jwt.secret=sua_chave_secreta_muito_segura_com_muitos_caracteres_aleatorios_aqui_2024
jwt.expiration=86400000

# ============================================
# APPLICATION CONFIGURATION
# ============================================
server.servlet.context-path=/
server.port=8080

# ============================================
# LOGGING
# ============================================
logging.level.root=INFO
logging.level.com.senai.ecomerce=DEBUG
